<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TracciaFood</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.110.1/dist/umd/supabase.js"></script>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;background:#f0f2f5;color:#2c3e50;padding-bottom:80px}
header{background:linear-gradient(135deg,#2c3e50,#34495e);color:#fff;padding:12px 20px;position:sticky;top:0;z-index:100;display:flex;justify-content:space-between;align-items:center}
header h1{margin:0;font-size:16px}
.header-left .location{font-size:12px;color:#f1c40f;margin-top:2px;font-weight:600}
.header-left .datetime{font-size:11px;color:#bdc3c7;margin-top:2px}
.header-right{text-align:right;display:flex;flex-direction:column;align-items:flex-end;gap:5px}
.user-info{font-size:13px;font-weight:600;background:#34495e;padding:4px 10px;border-radius:12px;border:1px solid #7f8c8d}
.btn-logout{background:none;border:none;color:#e74c3c;font-size:11px;font-weight:600;cursor:pointer;text-decoration:underline}
.navbar{background:#fff;padding:10px;display:flex;gap:8px;overflow-x:auto;box-shadow:0 2px 4px rgba(0,0,0,.05);position:sticky;top:60px;z-index:90}
.navbar button{background:#ecf0f1;color:#2c3e50;border:none;padding:8px 15px;border-radius:20px;font-size:13px;font-weight:600;cursor:pointer;white-space:nowrap}
.navbar button.active{background:#3498db;color:#fff}
.navbar button.add-btn{background:#27ae60;color:#fff}
.container{padding:12px;max-width:800px;margin:0 auto;padding-bottom:100px}
#auth-screen{display:flex;flex-direction:column;justify-content:center;align-items:center;height:100vh;padding:20px;background:#f0f2f5}
.auth-box{background:#fff;padding:30px;border-radius:12px;box-shadow:0 4px 12px rgba(0,0,0,.1);width:100%;max-width:400px}
.auth-box h2{margin-top:0;text-align:center}
.auth-box input{width:100%;padding:12px;margin-bottom:12px;border:1.5px solid #dfe6e9;border-radius:8px;font-size:15px}
.auth-box button{width:100%;padding:12px;border:none;border-radius:8px;font-size:16px;font-weight:600;cursor:pointer;margin-bottom:10px}
.btn-login{background:#3498db;color:#fff}
.btn-register{background:#27ae60;color:#fff}
.auth-error{color:#e74c3c;font-size:13px;text-align:center;margin-bottom:10px;min-height:18px}
.auth-toggle{text-align:center;font-size:13px;color:#7f8c8d;margin-top:10px}
.auth-toggle a{color:#3498db;text-decoration:none;cursor:pointer;font-weight:600}
#app-screen{display:none}
.card{background:#fff;border-radius:12px;padding:14px;margin-bottom:12px;box-shadow:0 1px 4px rgba(0,0,0,.08);border-left:5px solid #3498db}
.card.urgent{border-left-color:#e74c3c;background:#fff5f5}
.card.warning{border-left-color:#f39c12;background:#fffaf0}
.card.ok{border-left-color:#27ae60}
.card.deleted{border-left-color:#95a5a6;opacity:.8;background:#f8f9fa}
.card h3{margin:0 0 6px 0;font-size:16px;display:flex;justify-content:space-between;align-items:center}
.card .meta{font-size:13px;color:#7f8c8d;line-height:1.6}
.card .meta strong{color:#2c3e50}
.card img{width:100%;max-height:180px;object-fit:cover;border-radius:8px;margin-top:10px}
.badge{display:inline-block;padding:3px 8px;border-radius:12px;font-size:11px;font-weight:600;margin-left:6px}
.badge.red{background:#e74c3c;color:#fff}
.badge.orange{background:#f39c12;color:#fff}
.badge.green{background:#27ae60;color:#fff}
.badge.gray{background:#95a5a6;color:#fff}
.badge.bell{background:#f1c40f;color:#2c3e50;animation:pulse 2s infinite}
@keyframes pulse{0%{opacity:1}50%{opacity:.5}100%{opacity:1}}
.actions{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
button,.btn{padding:9px 14px;border:none;border-radius:8px;font-size:14px;font-weight:600;cursor:pointer;flex:1;min-width:80px}
.btn-primary{background:#3498db;color:#fff}
.btn-danger{background:#e74c3c;color:#fff}
.btn-success{background:#27ae60;color:#fff}
.btn-secondary{background:#ecf0f1;color:#2c3e50}
.btn-restore{background:#f39c12;color:#fff}
.btn-camera{background:#27ae60;color:#fff;display:flex;align-items:center;justify-content:center;gap:8px;padding:12px;font-size:15px;width:100%;margin-bottom:10px;border-radius:8px;box-shadow:0 2px 4px rgba(39,174,96,.3)}
.btn-camera:active{transform:scale(.98)}
.modal{display:none;position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:200;align-items:flex-end;justify-content:center}
.modal.show{display:flex}
.modal-content{background:#fff;width:100%;max-width:600px;max-height:92vh;overflow-y:auto;border-radius:16px 16px 0 0;padding:20px;padding-bottom:120px;animation:slideUp .25s ease}
@keyframes slideUp{from{transform:translateY(100%)}to{transform:translateY(0)}}
.modal-content h2{margin:0 0 16px 0;font-size:18px}
.form-group{margin-bottom:14px}
.form-group label{display:block;font-size:13px;font-weight:600;margin-bottom:5px;color:#555}
.form-group input,.form-group textarea{width:100%;padding:11px;border:1.5px solid #dfe6e9;border-radius:8px;font-size:15px;font-family:inherit;background:#fafbfc}
.form-group input:focus,.form-group textarea:focus{outline:none;border-color:#3498db}
.photo-preview{max-width:100%;max-height:150px;border-radius:8px;margin-top:8px;display:none}
.empty{text-align:center;color:#95a5a6;padding:40px 20px}
.empty .big{font-size:50px;margin-bottom:10px}
.search-bar{width:100%;padding:11px 14px;border:1.5px solid #dfe6e9;border-radius:10px;font-size:15px;margin-bottom:12px;background:#fff}
.qr-container{text-align:center;padding:20px}
.qr-container canvas,.qr-container img{max-width:100%}
#reader{width:100%;border-radius:12px;overflow:hidden}
.stats{display:flex;gap:8px;margin-bottom:12px}
.stat{flex:1;background:#fff;padding:12px;border-radius:10px;text-align:center}
.stat .num{font-size:24px;font-weight:700}
.stat .lbl{font-size:11px;color:#7f8c8d;text-transform:uppercase}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#2c3e50;color:#fff;padding:10px 18px;border-radius:20px;font-size:14px;z-index:300;opacity:0;transition:opacity .3s;pointer-events:none}
.toast.show{opacity:1}
.loading{text-align:center;padding:30px;color:#7f8c8d}
.status-bar{font-size:12px;font-weight:600;color:#7f8c8d;text-align:center;padding:8px;background:#fff;border-radius:8px;margin-bottom:10px;border:1px solid #dfe6e9}
.status-bar.online{color:#27ae60;background:#e8f8f5;border-color:#a3e4d7}
.status-bar.error{color:#e74c3c;background:#fdedec;border-color:#f5b7b1}
.switch{position:relative;display:inline-block;width:50px;height:26px}
.switch input{opacity:0;width:0;height:0}
.slider{position:absolute;cursor:pointer;top:0;left:0;right:0;bottom:0;background-color:#ccc;transition:.4s;border-radius:26px}
.slider:before{position:absolute;content:"";height:20px;width:20px;left:3px;bottom:3px;background-color:#fff;transition:.4s;border-radius:50%}
input:checked+.slider{background-color:#27ae60}
input:checked+.slider:before{transform:translateX(24px)}
@media print{body *{visibility:hidden}#modal-qr,#modal-qr *{visibility:visible}#modal-qr{position:absolute;left:0;top:0;width:100%;background:#fff;display:block!important;padding:0;margin:0}.modal-content{box-shadow:none;border-radius:0;max-width:100%;padding:0;margin:0;overflow:visible}.modal-content h2{display:none}.qr-container{padding:10px;margin:0 auto;text-align:center}.qr-print-details{display:block!important;text-align:center;font-size:14px;margin-top:10px;color:#000}.qr-print-details strong{font-size:18px;display:block;margin-bottom:5px}.actions{display:none!important}}
.qr-print-details{display:none}
</style>
</head>
<body>

<div id="auth-screen">
  <div class="auth-box">
    <h2 id="auth-title">Accedi</h2>
    <div class="auth-error" id="auth-error"></div>
    <div id="group-username" style="display: none;"><input type="text" id="auth-username" placeholder="Scegli un nome utente"></div>
    <div id="group-location" style="display: none;"><input type="text" id="auth-location" placeholder="Nome del Locale"></div>
    <input type="email" id="auth-email" placeholder="La tua email">
    <input type="password" id="auth-password" placeholder="La tua password">
    <button class="btn-login" id="btn-login" onclick="handleLogin()">Accedi</button>
    <button class="btn-register" id="btn-register" onclick="handleRegister()" style="display:none;">Registrati</button>
    <div class="auth-toggle"><span id="toggle-text">Non hai un account?</span><a id="toggle-link" onclick="toggleAuthMode()">Registrati</a></div>
  </div>
</div>

<div id="app-screen">
  <header>
    <div class="header-left"><h1>🍽️ TracciaFood</h1><div class="location" id="location-display">Locale</div><div class="datetime" id="datetime-display">Caricamento...</div></div>
    <div class="header-right"><span class="user-info" id="user-name-display">Utente</span><button class="btn-logout" onclick="handleLogout()">Esci</button></div>
  </header>
  <div class="navbar">
    <button class="active" onclick="switchView('products')" id="nav-products">📦 Prodotti</button>
    <button class="add-btn" onclick="openForm()" id="nav-add">➕ Nuovo</button>
    <button onclick="switchView('scanner')" id="nav-scanner">📷 Scansiona</button>
    <button onclick="switchView('trash')" id="nav-trash">🗑️ Cestino</button>
  </div>
  <div id="view-products" class="container">
    <div class="status-bar" id="status-bar">⏳ Connessione...</div>
    <div class="stats"><div class="stat"><div class="num" id="stat-total" style="color:#3498db">0</div><div class="lbl">Totali</div></div><div class="stat"><div class="num" id="stat-urgent" style="color:#e74c3c">0</div><div class="lbl">In scadenza</div></div><div class="stat"><div class="num" id="stat-expired" style="color:#7f8c8d">0</div><div class="lbl">Scaduti</div></div></div>
    <input type="text" class="search-bar" id="search" placeholder="🔍 Cerca per Nome, Lotto o Data...">
    <div id="products-list"></div>
  </div>
  <div id="view-scanner" class="container" style="display:none">
    <div class="card" style="border-left-color:#27ae60"><h3>📷 Scansiona QR</h3><p style="font-size:13px;color:#7f8c8d;margin:8px 0">Inquadra il QR code.</p></div>
    <div id="reader"></div>
    <button class="btn btn-secondary" id="stop-scan" style="margin-top:12px;display:none" onclick="stopScanner()">⏹ Ferma</button>
    <div id="scan-result"></div>
  </div>
  <div id="view-trash" class="container" style="display:none">
    <div class="card" style="border-left-color:#95a5a6"><h3>🗑️ Cestino</h3><p style="font-size:13px;color:#7f8c8d;margin:8px 0">Prodotti eliminati del tuo locale.</p></div>
    <div id="trash-list"></div>
  </div>
</div>

<div class="modal" id="modal-form">
  <div class="modal-content">
    <h2 id="form-title">➕ Nuovo Prodotto</h2>
    <form id="product-form" onsubmit="saveProduct(event)" novalidate>
      <input type="hidden" id="product-id">
      <div class="form-group"><label>Nome *</label><input type="text" id="f-nome" required></div>
      <div class="form-group"><label>Lotto</label><input type="text" id="f-lotto"></div>
      <div class="form-group"><label>Data preparazione</label><input type="date" id="f-preparazione"></div>
      <div class="form-group"><label>Data scadenza</label><input type="date" id="f-scadenza"></div>
      <div class="form-group"><label>Quantità</label><input type="text" id="f-quantita"></div>
      <div class="form-group"><label>Note</label><textarea id="f-note" rows="2"></textarea></div>
      <div class="form-group">
        <label>Foto Prodotto</label>
        <button type="button" class="btn-camera" onclick="document.getElementById('f-foto').click()">📸 Scatta Foto (Fotocamera/Webcam)</button>
        <input type="file" id="f-foto" accept="image/*" capture="environment" onchange="previewPhoto(event)" style="display:none;">
        <div id="photo-container" style="display:none; margin-top:8px;">
          <img id="photo-preview" class="photo-preview" style="display:block;" alt="Anteprima foto" src="data:image/gif;base64,R0lGODlhAQABAIAAAAAAAP///yH5BAEAAAAALAAAAAABAAEAAAIBRAA7">
          <button type="button" class="btn btn-danger" onclick="removePhoto()" style="margin-top:5px; width:auto; padding:5px 10px; font-size:12px;">❌ Rimuovi Foto</button>
        </div>
      </div>
      <div class="form-group" style="display:flex;justify-content:space-between;align-items:center;background:#f8f9fa;padding:10px;border-radius:8px;border:1px solid #dfe6e9;">
        <label style="margin:0;">🔔 Avvisami alla scadenza</label>
        <label class="switch"><input type="checkbox" id="f-alert"><span class="slider"></span></label>
      </div>
      <div class="actions"><button type="button" class="btn btn-secondary" onclick="closeForm()">Annulla</button><button type="submit" class="btn btn-primary" id="save-btn">💾 Salva</button></div>
    </form>
  </div>
</div>

<div class="modal" id="modal-qr">
  <div class="modal-content">
    <h2>📱 QR Code</h2>
    <div class="qr-container" id="qr-container"></div>
    <div class="qr-print-details" id="qr-print-details"></div>
    <div class="actions"><button class="btn btn-primary" onclick="window.print()">🖨️ Stampa</button><button class="btn btn-secondary" onclick="closeModal('modal-qr')">Chiudi</button></div>
  </div>
</div>

<div class="toast" id="toast"></div><script>
const SUPABASE_URL = 'https://hcwtklceozkdwjsvixmh.supabase.co';
const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imhjd3RrbGNlb3prZHdqc3ZpeG1oIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTMyNTk5NTQsImV4cCI6MjEwODgzNTk1NH0.au4ijN0B9QVMdzVz6rzoiAe6iFv_TU6KUjbZSLWEMyY';
let supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
let currentUser = null, isLoginMode = true, allProducts = [], isLoading = false, currentPhoto = null, html5QrCode = null, currentView = 'products', realtimeChannel = null, clockInterval = null;

function startClock() { if (clockInterval) clearInterval(clockInterval); const updateClock = () => { const now = new Date(); document.getElementById('datetime-display').textContent = now.toLocaleDateString('it-IT',{weekday:'short',day:'numeric',month:'short'}) + ' - ' + now.toLocaleTimeString('it-IT',{hour:'2-digit',minute:'2-digit'}); }; updateClock(); clockInterval = setInterval(updateClock, 1000); }
supabaseClient.auth.onAuthStateChange(async (event, session) => { if (session) { currentUser = session.user; document.getElementById('auth-screen').style.display = 'none'; document.getElementById('app-screen').style.display = 'block'; document.getElementById('user-name-display').textContent = currentUser.user_metadata?.username || currentUser.email.split('@')[0]; document.getElementById('location-display').textContent = currentUser.user_metadata?.location || 'Locale Principale'; startClock(); await loadAndRender(); initRealtime(); setTimeout(checkAlerts, 2000); } else { currentUser = null; document.getElementById('auth-screen').style.display = 'flex'; document.getElementById('app-screen').style.display = 'none'; if (clockInterval) clearInterval(clockInterval); if (realtimeChannel) { supabaseClient.removeChannel(realtimeChannel); realtimeChannel = null; } } });
function initRealtime() { if (realtimeChannel) return; realtimeChannel = supabaseClient.channel('prodotti-changes').on('postgres_changes', { event: '*', schema: 'public', table: 'prodotti' }, () => loadAndRender()).subscribe(); }
function toggleAuthMode() { isLoginMode = !isLoginMode; document.getElementById('auth-title').textContent = isLoginMode ? 'Accedi' : 'Registrati'; document.getElementById('btn-login').style.display = isLoginMode ? 'block' : 'none'; document.getElementById('btn-register').style.display = isLoginMode ? 'none' : 'block'; document.getElementById('group-username').style.display = isLoginMode ? 'none' : 'block'; document.getElementById('group-location').style.display = isLoginMode ? 'none' : 'block'; document.getElementById('toggle-text').textContent = isLoginMode ? 'Non hai un account?' : 'Hai già un account?'; document.getElementById('toggle-link').textContent = isLoginMode ? 'Registrati' : 'Accedi'; document.getElementById('auth-error').textContent = ''; }
async function handleLogin() { const email = document.getElementById('auth-email').value.trim(), password = document.getElementById('auth-password').value, errorEl = document.getElementById('auth-error'); errorEl.textContent = ''; if (!email || !password) return errorEl.textContent = 'Inserisci email e password.'; const { error } = await supabaseClient.auth.signInWithPassword({ email, password }); if (error) errorEl.textContent = 'Errore: ' + error.message; }
async function handleRegister() { const email = document.getElementById('auth-email').value.trim(), password = document.getElementById('auth-password').value; const username = document.getElementById('auth-username').value.trim(), location = document.getElementById('auth-location').value.trim(); const errorEl = document.getElementById('auth-error'); errorEl.textContent = ''; if (!username) return errorEl.textContent = 'Inserisci un nome utente.'; if (!location) return errorEl.textContent = 'Inserisci il nome del locale.'; if (!email || !password) return errorEl.textContent = 'Inserisci email e password.'; if (password.length < 6) return errorEl.textContent = 'Minimo 6 caratteri.'; const { data, error } = await supabaseClient.auth.signUp({ email, password, options: { data: { username, location } } }); if (error) errorEl.textContent = 'Errore: ' + error.message; else if (data.user && !data.session) { errorEl.style.color = '#27ae60'; errorEl.textContent = 'Registrato! Controlla la mail.'; } }
async function handleLogout() { await supabaseClient.auth.signOut(); }
function setStatus(msg, cls) { const el = document.getElementById('status-bar'); if (el) { el.textContent = msg; el.className = 'status-bar ' + (cls || ''); } }
function toast(msg) { const t = document.getElementById('toast'); if (t) { t.textContent = msg; t.classList.add('show'); setTimeout(() => t.classList.remove('show'), 2500); } }
function daysToExpiry(s) { if (!s) return 999; const t = new Date(); t.setHours(0,0,0,0); const e = new Date(s); e.setHours(0,0,0,0); return Math.ceil((e - t) / 86400000); }
function formatDate(d) { if (!d) return '—'; const p = String(d).split('T')[0].split('-'); return p.length !== 3 ? d : `${p[2]}/${p[1]}/${p[0]}`; }
function escapeHtml(s) { return s ? String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])) : ''; }
function checkAlerts() { if (!allProducts || allProducts.length === 0) return; const alerts = allProducts.filter(p => p.alert && !p.deleted_at && daysToExpiry(p.scadenza) <= 3); if (alerts.length > 0) { let msg = "🔔 ATTENZIONE! Prodotti in scadenza:\n\n"; alerts.forEach(p => { const d = daysToExpiry(p.scadenza); msg += `- ${p.nome} (${d < 0 ? `SCADUTO da ${Math.abs(d)} gg` : (d === 0 ? "SCADE OGGI" : `Scade tra ${d} gg`)})\n`; }); alert(msg); } }
async function loadAndRender() { if (isLoading || !currentUser) return; isLoading = true; try { const userLocation = currentUser.user_metadata?.location || 'Locale Principale'; const { data, error } = await supabaseClient.from('prodotti').select('*').eq('location', userLocation).order('scadenza', { ascending: true }); if (error) throw error; allProducts = data || []; if (currentView === 'products') { const active = allProducts.filter(p => !p.deleted_at); setStatus('✅ Connesso — ' + active.length + ' prodotti', 'online'); renderProductList(active); updateStats(active); } else if (currentView === 'trash') { renderTrashList(allProducts.filter(p => p.deleted_at)); } } catch(e) { setStatus('❌ Errore DB: ' + e.message, 'error'); } finally { isLoading = false; } }
function updateStats(products) { let urgent = 0, expired = 0; products.forEach(p => { const d = daysToExpiry(p.scadenza); if (d < 0) expired++; else if (d <= 3) urgent++; }); document.getElementById('stat-total').textContent = products.length; document.getElementById('stat-urgent').textContent = urgent; document.getElementById('stat-expired').textContent = expired; }
function renderProductList(products) { const search = document.getElementById('search').value.toLowerCase(), list = document.getElementById('products-list'); const filtered = products.filter(p => (p.nome||'').toLowerCase().includes(search) || (p.lotto||'').toLowerCase().includes(search) || (p.preparazione?formatDate(p.preparazione).includes(search)||String(p.preparazione).includes(search):false) || (p.scadenza?formatDate(p.scadenza).includes(search)||String(p.scadenza).includes(search):false)); if (filtered.length === 0) return list.innerHTML = `<div class="empty"><div class="big">📦</div><p>Nessun prodotto trovato.</p></div>`; list.innerHTML = filtered.map(p => { const days = daysToExpiry(p.scadenza); let cls = 'ok', badge = '', alertBadge = p.alert ? `<span class="badge bell">🔔</span>` : ''; if (!p.scadenza) badge = ''; else if (days < 0) { cls = 'urgent'; badge = `<span class="badge red">SCADUTO</span>`; } else if (days === 0) { cls = 'urgent'; badge = `<span class="badge red">OGGI</span>`; } else if (days <= 3) { cls = 'warning'; badge = `<span class="badge orange">${days}g</span>`; } else badge = `<span class="badge green">${days}g</span>`; return `<div class="card ${cls}"><h3>${escapeHtml(p.nome)} ${alertBadge} ${badge}</h3><div class="meta"><strong>Lotto:</strong> ${escapeHtml(p.lotto||'—')}<br><strong>Prep:</strong> ${formatDate(p.preparazione)} | <strong>Scade:</strong> ${formatDate(p.scadenza)}<br>${p.quantita?`<strong>Q.tà:</strong> ${escapeHtml(p.quantita)}<br>`:''}${p.note?`<strong>Note:</strong> ${escapeHtml(p.note)}`:''}</div>${p.foto?`<img src="${p.foto}" alt="Foto prodotto">`:''}<div class="actions"><button class="btn btn-success" onclick="showQR(${p.id})">📱 QR</button><button class="btn btn-primary" onclick="openForm(${p.id})">✏️ Modifica</button><button class="btn btn-danger" onclick="softDeleteProduct(${p.id})">🗑️ Elimina</button></div></div>`; }).join(''); }
function renderTrashList(products) { const list = document.getElementById('trash-list'); if (products.length === 0) return list.innerHTML = `<div class="empty"><div class="big">🗑️</div><p>Il cestino è vuoto.</p></div>`; list.innerHTML = products.map(p => `<div class="card deleted"><h3>${escapeHtml(p.nome)} <span class="badge gray">ELIMINATO</span></h3><div class="meta"><strong>Lotto:</strong> ${escapeHtml(p.lotto||'—')}<br><strong>Scadenza:</strong> ${formatDate(p.scadenza)}<br><small>Eliminato il: ${formatDate(p.deleted_at)}</small></div><div class="actions"><button class="btn btn-restore" onclick="restoreProduct(${p.id})">♻️ Ripristina</button></div></div>`).join(''); }
function openForm(id) { currentPhoto = null; document.getElementById('photo-container').style.display = 'none'; document.getElementById('f-foto').value = ''; document.getElementById('product-form').reset(); document.getElementById('product-id').value = ''; if (id) { const p = allProducts.find(x => x.id === id); if (!p) return; document.getElementById('form-title').textContent = '✏️ Modifica'; document.getElementById('product-id').value = p.id; document.getElementById('f-nome').value = p.nome; document.getElementById('f-lotto').value = p.lotto || ''; document.getElementById('f-preparazione').value = p.preparazione ? String(p.preparazione).split('T')[0] : ''; document.getElementById('f-scadenza').value = p.scadenza ? String(p.scadenza).split('T')[0] : ''; document.getElementById('f-quantita').value = p.quantita || ''; document.getElementById('f-note').value = p.note || ''; document.getElementById('f-alert').checked = p.alert || false; if (p.foto) { currentPhoto = p.foto; document.getElementById('photo-preview').src = p.foto; document.getElementById('photo-container').style.display = 'block'; } } else { document.getElementById('form-title').textContent = '➕ Nuovo'; document.getElementById('f-preparazione').value = new Date().toISOString().split('T')[0]; document.getElementById('f-alert').checked = true; } document.getElementById('modal-form').classList.add('show'); }
function closeForm() { document.getElementById('modal-form').classList.remove('show'); }
function previewPhoto(e) { const file = e.target.files[0]; if (!file) return; const reader = new FileReader(); reader.onload = () => { const img = new Image(); img.onload = () => { let { width, height } = img; if (width > height && width > 800) { height = height * 800 / width; width = 800; } else if (height > 800) { width = width * 800 / height; height = 800; } const canvas = document.createElement('canvas'); canvas.width = width; canvas.height = height; canvas.getContext('2d').drawImage(img, 0, 0, width, height); currentPhoto = canvas.toDataURL('image/jpeg', 0.75); document.getElementById('photo-preview').src = currentPhoto; document.getElementById('photo-container').style.display = 'block'; }; img.src = reader.result; }; reader.readAsDataURL(file); }
function removePhoto() { currentPhoto = null; document.getElementById('f-foto').value = ''; document.getElementById('photo-container').style.display = 'none'; }
async function saveProduct(e) { e.preventDefault(); const nome = document.getElementById('f-nome').value.trim(); if (!nome) return toast('⚠️ Il nome è obbligatorio'); const id = document.getElementById('product-id').value; document.getElementById('save-btn').textContent = '⏳...'; const obj = { nome: nome, lotto: document.getElementById('f-lotto').value.trim() || null, preparazione: document.getElementById('f-preparazione').value || null, scadenza: document.getElementById('f-scadenza').value || null, quantita: document.getElementById('f-quantita').value.trim() || null, note: document.getElementById('f-note').value.trim() || null, foto: currentPhoto || null, alert: document.getElementById('f-alert').checked, user_id: currentUser.id, location: currentUser.user_metadata?.location || 'Locale Principale' }; let error; if (id) { const { id: _, ...updateData } = obj; const { error: updateError } = await supabaseClient.from('prodotti').update(updateData).eq('id', parseInt(id)); error = updateError; } else { const { error: insertError } = await supabaseClient.from('prodotti').insert([obj]); error = insertError; } document.getElementById('save-btn').textContent = '💾 Salva'; if (error) return toast('❌ Errore: ' + error.message); closeForm(); toast(id ? '✅ Aggiornato' : '✅ Salvato'); loadAndRender(); }
async function softDeleteProduct(id) { if (!confirm('Spostare nel cestino?')) return; await supabaseClient.from('prodotti').update({ deleted_at: new Date().toISOString() }).eq('id', id); toast('🗑️ Spostato'); loadAndRender(); }
async function restoreProduct(id) { await supabaseClient.from('prodotti').update({ deleted_at: null }).eq('id', id); toast('✅ Ripristinato'); loadAndRender(); }
async function showQR(id) { const { data: p } = await supabaseClient.from('prodotti').select('*').eq('id', id).single(); if (!p) return toast('❌ Non trovato'); const qrText = "TF-" + p.id; const container = document.getElementById('qr-container'); container.innerHTML = ''; new QRCode(container, { text: qrText, width: 250, height: 250, colorDark: "#2c3e50", colorLight: "#ffffff" }); const details = document.getElementById('qr-print-details'); details.innerHTML = `<strong>${escapeHtml(p.nome)}</strong>${p.lotto ? `Lotto: ${escapeHtml(p.lotto)}<br>` : ''}${p.scadenza ? `Scadenza: ${formatDate(p.scadenza)}` : ''}`; document.getElementById('modal-qr').classList.add('show'); }
function closeModal(id) { document.getElementById(id).classList.remove('show'); }
document.querySelectorAll('.modal').forEach(m => { m.addEventListener('click', e => { if (e.target === m) m.classList.remove('show'); }); });
function switchView(view) { currentView = view; document.getElementById('view-products').style.display = view === 'products' ? 'block' : 'none'; document.getElementById('view-scanner').style.display = view === 'scanner' ? 'block' : 'none'; document.getElementById('view-trash').style.display = view === 'trash' ? 'block' : 'none'; document.getElementById('nav-products').classList.toggle('active', view === 'products'); document.getElementById('nav-scanner').classList.toggle('active', view === 'scanner'); document.getElementById('nav-trash').classList.toggle('active', view === 'trash'); if (view === 'scanner') startScanner(); else stopScanner(); if (view === 'trash') loadAndRender(); else if (view === 'products') loadAndRender(); }
function startScanner() { if (html5QrCode) return; document.getElementById('scan-result').innerHTML = ''; html5QrCode = new Html5Qrcode("reader"); html5QrCode.start({ facingMode: "environment" }, { fps: 10, qrbox: { width: 250, height: 250 } }, (decodedText) => { stopScanner(); handleScan(decodedText); }, () => {} ).then(() => document.getElementById('stop-scan').style.display = 'block').catch(err => { document.getElementById('scan-result').innerHTML = `<div class="card urgent">⚠️ Errore fotocamera</div>`; html5QrCode = null; }); }
function stopScanner() { if (html5QrCode) html5QrCode.stop().then(() => { html5QrCode.clear(); html5QrCode = null; document.getElementById('stop-scan').style.display = 'none'; }).catch(() => {}); }
async function handleScan(text) { const out = document.getElementById('scan-result'); out.innerHTML = '<div class="loading">⏳ Ricerca...</div>'; let productId = null; if (text.startsWith("TF-")) productId = parseInt(text.replace("TF-", "")); else { try { const d = JSON.parse(text); if(d.app === 'TracciaFood') { const p = allProducts.find(x => x.nome === d.nome && x.lotto === d.lotto); if(p) productId = p.id; } } catch(e) {} } if (!productId) { out.innerHTML = `<div class="card warning"><h3>QR non valido</h3></div><button class="btn btn-primary" style="width:100%" onclick="switchView('scanner')">📷 Riprova</button>`; return; } const { data: p } = await supabaseClient.from('prodotti').select('*').eq('id', productId).single(); if (!p) { out.innerHTML = `<div class="card urgent"><h3>Prodotto non trovato</h3></div><button class="btn btn-primary" style="width:100%" onclick="switchView('scanner')">📷 Riprova</button>`; return; } const days = daysToExpiry(p.scadenza); let status = `✅ Valido - scade tra ${days} gg`, cls = 'ok'; if (days < 0) { status = `❌ SCADUTO da ${Math.abs(days)} gg`; cls = 'urgent'; } else if (days === 0) { status = `⚠️ SCADE OGGI`; cls = 'urgent'; } else if (days <= 3) { status = `⚠️ Scade tra ${days} gg`; cls = 'warning'; } out.innerHTML = `<div class="card ${cls}"><h3>${escapeHtml(p.nome)}</h3><div class="meta"><strong>Lotto:</strong> ${escapeHtml(p.lotto||'—')}<br><strong>Prep:</strong> ${formatDate(p.preparazione)} | <strong>Scade:</strong> ${formatDate(p.scadenza)}<br>${p.quantita?`<strong>Q.tà:</strong> ${escapeHtml(p.quantita)}<br>`:''}${p.note?`<strong>Note:</strong> ${escapeHtml(p.note)}`:''}</div><div style="margin-top:12px;font-weight:700;font-size:15px">${status}</div></div><button class="btn btn-primary" style="width:100%" onclick="switchView('scanner')">📷 Scansiona un altro</button>`; }
</script>
